name: Feature Request
description: Suggest an idea or enhancement for Photo CRM
title: 'feat: [short description of requested feature]'
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement!
        Please review the [Product Vision](docs/product/vision.md) and [MVP Scope](docs/product/mvp-scope.md) before submitting.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? A clear and concise description of what the problem is.
      placeholder: I am always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Workflow
      description: Describe the solution you'd like to see, focusing on the photographer's or client's workflow.
      placeholder: It would be great if Photo CRM could...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Any alternative solutions or workarounds you have considered.
  - type: textarea
    id: privacy-impact
    attributes:
      label: Privacy & Data Considerations
      description: Does this feature store or process personal client data? If so, what data is collected and why?
      placeholder: E.g., client email for contract signature notifications.
    validations:
      required: true
  - type: checkboxes
    id: checklists
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions to make sure this is not a duplicate.
          required: true
        - label: I agree to uphold privacy-by-design principles for this feature.
          required: true
