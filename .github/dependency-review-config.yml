fail-on-severity: high
license-check: true
vulnerability-check: true
allow-licenses:
  - 0BSD
  - AGPL-3.0
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - Apache-2.0
  - Artistic-2.0
  - BlueOak-1.0.0
  - BSD-2-Clause
  - BSD-3-Clause
  - CC0-1.0
  - GPL-3.0
  - GPL-3.0-only
  - GPL-3.0-or-later
  - ISC
  - LGPL-3.0
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - MIT
  - MIT-0
  - MPL-2.0
  - Python-2.0
  - Unlicense
  - WTFPL
allow-dependencies-licenses:
  - 'pkg:npm/caniuse-lite'
  - 'pkg:npm/spdx-exceptions'
